<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novatix JSON Formatter &amp; Validator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img src="icons/icon48.png" alt="Novatix logo" class="app-logo">
      <div>
        <h1>JSON Formatter <span class="accent">&amp;</span> Validator</h1>
        <p class="tagline">Novatix Agency &middot; 100% offline</p>
      </div>
    </header>

    <label class="field-label" for="json-input">JSON Input</label>
    <textarea id="json-input" rows="10" spellcheck="false"
      placeholder='{"name": "example", "tags": ["a", "b"]}'></textarea>

    <div class="btn-row">
      <button id="btn-format" class="btn btn-primary" type="button">Format</button>
      <button id="btn-minify" class="btn" type="button">Minify</button>
      <button id="btn-validate" class="btn" type="button">Validate</button>
      <button id="btn-sample" class="btn btn-ghost" type="button">Sample</button>
      <button id="btn-clear" class="btn btn-ghost" type="button">Clear</button>
    </div>

    <div id="status-bar" class="status-bar status-hidden">
      <span id="status-message" class="status-message"></span>
    </div>

    <section id="output-section" class="output-section output-hidden">
      <div class="output-head">
        <h2>Output</h2>
        <button id="btn-copy" class="btn btn-small" type="button">
          <span id="copy-label">Copy</span>
        </button>
      </div>
      <pre id="output" class="output-pre"><code id="output-code"></code></pre>
      <div class="stats-row">
        <div class="stat"><span class="stat-label">Characters</span><span id="stat-chars" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Lines</span><span id="stat-lines" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Structure</span><span id="stat-structure" class="stat-value">&mdash;</span></div>
      </div>
    </section>

    <footer class="app-footer">
      <a href="https://novatix.agency/tools/" target="_blank" rel="noopener">More free tools &rarr;</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
